name: CI
on: [push, pull_request]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-go@v5
        with: {go-version: '1.23'}
      - name: Install TinyGo
        run: |
          wget https://github.com/tinygo-org/tinygo/releases/download/v0.34.0/tinygo_0.34.0_amd64.deb
          sudo dpkg -i tinygo_0.34.0_amd64.deb
      - run: npm install
      - run: npm run test:go
      - run: npm run build
      - name: Commit browser WASM assets for static hosting
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/wasm/kodiledger.wasm public/wasm/wasm_exec.js
          if ! git diff --cached --quiet; then
            git commit -m "build: update committed Go WASM assets"
            git push
          fi
